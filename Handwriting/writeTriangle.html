<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WebGL2 · 三角形</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d14; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const gl = canvas.getContext('webgl2', { antialias: true });
        if(!gl) {
            console.log('Failed to get WebGL2 context');
        }

        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        gl.viewport(0, 0, canvas.width, canvas.height);

        const vertexShaderSource = `#version 300 es
        in vec2 a_pos;
        void main() {
            gl_Position = vec4(a_pos, 0.0, 1.0);
        }` 

        const fragmentShaderSource = `#version 300 es
        precision mediump float;
        out vec4 outColor;
         void main() {
            outColor = vec4(1.0, 0.0, 0.0, 1.0);
         }
        `
        const program = gl.createProgram();

        // function compile(type, source) {
        //     const shader = gl.createShader(type);
        //     gl.shaderSource(shader, source);
        //     gl.compileShader(shader);
        //     if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        //         throw new Error(gl.getShaderInfoLog(shader));
        //     }
        //     return shader;
        // }
        // gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexShaderSource));
        // gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentShaderSource));

        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.compileShader(vertexShader);
        gl.compileShader(fragmentShader);
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);

        const data = new Float32Array([
            0.0, 1.0, 0.5, -1.0, -0.5, 0.0
        ])

        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao)
        const loc = gl.getAttribLocation(program, 'a_pos');
        gl.enableVertexAttribArray(loc);

        gl.vertexAttribPointer(0,2,gl.FLOAT, false, 0, 0);

        gl.clearColor(0.0,0.0,0.0,1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES,0,3);        
    </script>
</body>
</html>
